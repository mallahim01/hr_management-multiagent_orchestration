# ─────────────────────────────────────────────────────────────
# Multi-Agent HR Demo – Configuration
# ─────────────────────────────────────────────────────────────
# Switch orchestration backend without touching any business logic.
# Options: native | crewai | langgraph | adk
orchestrator_backend: native

# The user that all demo workflows operate on (auto-created on first run)
active_user_id: 3

# LLM settings
# provider selects the endpoint + which .env keys are read (see core/llm_wrapper.py)
llm:
  provider: groq                    # groq | openai
  model: llama-3.3-70b-versatile    # cost-efficient model for demos
  max_retries: 3
  temperature: 0.7

# SQLite database file (relative to project root)
database:
  path: data/hr_demo.db

# How many recent messages to include as context for each agent call
conversation:
  history_size: 3

# Knowledge base — hybrid RAG over Milvus, used by CompanyKnowledgeAgent.
# Embeddings come from Google (GOOGLE_API_KEY); chat generation stays on the
# llm provider above. Set enabled: false to answer from data/company_policy.txt
# instead, which is also the automatic fallback when Milvus is unreachable.
knowledge:
  enabled: true
  milvus_uri: http://localhost:19530
  milvus_token: ""                    # leave empty for a local standalone Milvus
  collection: hr_knowledge_base
  embedding_model: gemini-embedding-001
  dimension: 768                      # Matryoshka truncation of the native 3072
  chunk_max_chars: 1200
  chunk_overlap: 150
  top_k: 5                            # extracts passed to the LLM
  candidate_k: 20                     # per-arm candidates fetched before fusion
  rrf_k: 60                           # Reciprocal Rank Fusion smoothing constant

# Web server settings (used by app.py)
server:
  host: "127.0.0.1"
  port: 5000
  debug: true
